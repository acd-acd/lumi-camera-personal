Overlay.open{display:block}.overlayHeader{display:flex;align-items:center;justify-content:space-between;gap:10px}.gallery{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:7px;margin-top:16px}.thumb{width:100%;aspect-ratio:3/4;object-fit:cover;border-radius:10px;background:#322b36}.help{font-size:12px;line-height:1.7;color:#c8c1d1;margin-top:14px}.galleryItem{position:relative}.galleryItem button{width:100%;border:0;background:none;padding:0}.galleryItem small{display:block;color:#aaa;font-size:10px;text-align:center} @media(max-height:680px){.top{min-height:44px}.panel{max-height:45dvh}.categories{padding:6px 10px}.cat{min-height:41px;padding:8px 12px}.toolstrip{padding:4px 10px}.tool{min-height:40px}.adjust{padding:3px 12px 5px;min-height:65px}.bottom{padding-top:5px}.bottom .capture{width:58px;height:58px;min-width:58px;min-height:58px}}@media(max-width:360px){.top{padding-left:8px;padding-right:8px}.brand{font-size:14px}.bottom button{min-width:58px;font-size:11px}.tool{min-width:85px}}
