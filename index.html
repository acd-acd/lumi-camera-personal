<!doctype html>
<html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,maximum-scale=1,user-scalable=no"><meta name="theme-color" content="#13131a"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"><meta name="apple-mobile-web-app-title" content="Lumi Camera"><link rel="manifest" href="manifest.webmanifest"><link rel="apple-touch-icon" href="icon-192.png"><title>Lumi Camera — Portrait Studio</title><style>
:root{color-scheme:dark;--bg:#111118;--panel:#20202b;--pale:#e8d9fe;--muted:#a8a7b7}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:#f9f7ff;font-family:-apple-system,BlinkMacSystemFont,"Hiragino Kaku Gothic ProN",sans-serif;-webkit-tap-highlight-color:transparent}button,input{font:inherit}button{cursor:pointer}button:disabled{opacity:.4} .shell{width:min(100%,550px);min-height:100dvh;margin:auto;display:flex;flex-direction:column;background:linear-gradient(#1e1c28,#111118)}header{height:62px;padding:8px 18px;display:flex;align-items:center;justify-content:space-between}.brand{font-size:18px;font-weight:760;letter-spacing:.05em}.brand span{color:#dac5ff} .sub{font-size:10px;font-weight:500;letter-spacing:.16em;color:#aaa6be}.ic{border:0;background:#ffffff14;color:#fff;border-radius:14px;padding:10px 12px}.stage{position:relative;margin:0 12px;aspect-ratio:3/4;max-height:59dvh;border-radius:22px;background:#292633;overflow:hidden;display:flex;align-items:center;justify-content:center;touch-action:none}.stage video,.stage canvas{position:absolute;width:100%;height:100%;object-fit:contain}.stage video{object-fit:cover;transform:scaleX(var(--mirror,1));filter:var(--preview-filter,none)}.stage canvas{display:none;touch-action:none}.stage.editing canvas{display:block}.stage.editing video{display:none}.stage .empty{padding:30px;text-align:center;color:#c9c4d7;font-size:14px;line-height:1.85}.stage .empty strong{font-size:20px;color:white}.tip{position:absolute;top:13px;left:13px;right:13px;text-align:center;background:#12121ac7;border:1px solid #ffffff2a;border-radius:12px;padding:7px;font-size:11px;pointer-events:none}.stage .grid{position:absolute;inset:0;pointer-events:none;display:none;background:linear-gradient(to right,transparent 33.2%,#ffffff5e 33.3%,transparent 33.6%,transparent 66.4%,#ffffff5e 66.7%,transparent 67%),linear-gradient(to bottom,transparent 33.2%,#ffffff5e 33.3%,transparent 33.6%,transparent 66.4%,#ffffff5e 66.7%,transparent 67%)}.tabs{display:flex;justify-content:space-between;padding:12px 16px 6px;gap:5px}.tab{flex:1;background:transparent;color:#9693a6;border:0;padding:11px 2px;border-radius:12px;font-size:13px}.tab.selected{background:#d9c5ff;color:#251e31;font-weight:750}.tools{padding:10px 16px 20px;background:#181821;border-radius:24px 24px 0 0;margin-top:auto;min-height:205px}.sectiontitle{display:flex;align-items:center;justify-content:space-between;color:#d4d0e4;font-size:12px;margin-bottom:8px}.presets{display:flex;gap:8px;overflow:auto;padding:4px 0 12px;scrollbar-width:none}.preset{min-width:82px;padding:10px 9px;background:#2b2a38;border:1px solid #454254;border-radius:13px;color:#edeaf4;font-size:12px}.preset.selected{border-color:#e5d5ff;background:#4c405f}.controlrow{display:grid;grid-template-columns:85px 1fr 35px;gap:10px;align-items:center;font-size:12px;color:#cac6d8;margin:12px 0}input[type=range]{accent-color:#dac6ff;width:100%;touch-action:auto}.value{text-align:right;color:#fff;font-variant-numeric:tabular-nums}.bar{display:flex;align-items:center;justify-content:space-around;padding:9px 15px calc(15px + env(safe-area-inset-bottom));gap:10px;background:#181821}.action{background:#292834;color:#f6f0ff;border:1px solid #464252;border-radius:14px;padding:11px 14px;font-size:12px}.primary{background:#e5d6ff;color:#211831;font-weight:800;border-color:transparent}.shutter{width:66px;height:66px;border-radius:50%;background:white;border:5px solid #15131c;outline:3px solid #f0eaff;box-shadow:0 0 0 5px #ffffff16;flex:none}.secondary{color:#a9a4b9;font-size:11px;line-height:1.7}.hidden{display:none!important}.rangegrid{display:grid;grid-template-columns:1fr 1fr;gap:5px 12px}.row{display:flex;gap:8px;flex-wrap:wrap}.note{background:#30283d;padding:9px;border-radius:10px;color:#dcd0ed;font-size:11px;line-height:1.6}.status{color:#bdb0ce;font-size:11px;min-height:16px;margin-top:6px}#file{display:none} .toast{position:fixed;left:50%;bottom:110px;transform:translateX(-50%);background:#eee5ff;color:#241d30;padding:12px 18px;border-radius:18px;opacity:0;pointer-events:none;transition:opacity .2s;z-index:9;white-space:nowrap;font-size:12px}.toast.on{opacity:1} @media(min-height:850px){.stage{max-height:62dvh}}@media(max-height:730px){.stage{max-height:49dvh}.tools{min-height:150px}} 
</style></head><body><div class="shell"><header><div><div class="brand">LUMI <span>CAMERA</span></div><div class="sub">PERSONAL PORTRAIT STUDIO</div></div><div class="row"><button class="ic" id="flip" title="前後カメラ切替">↻</button><button class="ic" id="gridbtn" title="グリッド">▦</button></div></header><main class="stage" id="stage"><video id="video" playsinline autoplay muted></video><canvas id="canvas"></canvas><div class="grid" id="grid"></div><div class="empty" id="empty"><strong>好きな一瞬を、もっと素敵に。</strong><br>「カメラを起動」か「写真を開く」から始めよう。<br><small>撮影にはHTTPS接続とカメラの許可が必要です。</small></div><div class="tip hidden" id="tip"></div></main><nav class="tabs"><button class="tab selected" data-tab="looks">フィルター</button><button class="tab" data-tab="tone">色調補正</button><button class="tab" data-tab="beauty">美肌</button><button class="tab" data-tab="face">顔補正</button></nav><section class="tools" id="tools"></section><footer class="bar"><button class="action" id="open">写真を開く</button><button class="shutter" id="shutter" title="撮影"></button><button class="action primary" id="save">保存する</button></footer><input id="file" type="file" accept="image/*"><div class="toast" id="toast"></div></div><script src="app.js"></script></body></html>
